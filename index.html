<main><header>温州蓝夹缬　／　互动染台</header><h1>五种夹板 × 三种输入</h1><p>分别观察操作端怎样输出动力、夹板怎样接收动力，再把它们接成整机。</p><nav id="tabs" aria-label="查看方式"><button data-group="head">5 种夹板传动</button> <button data-group="input">3 种交互传动</button> <button data-group="whole">15 组整机</button></nav><section id="single"><div id="choices"></div><h2 id="soloTitle"></h2><div class="soloGrid"><div><iframe id="soloView" title="单独传动模块三维视图"></iframe><label>模块行程　<output id="soloPct">0%</output><input id="soloTravel" type="range" min="0" max="100" value="0"></label></div><div id="soloNotes"></div></div><button class="primary" id="usePart">带入整机</button></section><div id="wholeGroup"><section style="margin:18px 0;background:#edf1e7;padding:12px"><label><b>夹板</b> <select id="headType"></select>　<b>操作输入</b>　<select id="inputType"></select></label> <label><input style="width:auto" id="sectionView" type="checkbox"> 剖开染盒与近侧压头</label><p><label>嵌入式预装　<select id="extType"></select></label> <button id="resetModel">返回选型</button></p><iframe title="同步三维总装" id="machine" style="display:block;width:100%;height:450px;border:0"></iframe><p id="route"></p><details open><summary>组合分析与样机实施</summary><div id="analysis"></div></details><details open><summary>嵌入式接口与验证</summary><p id="extNotes"></p></details></section><div class="rail" id="rail"></div><div class="panel"><div class="stage"><svg viewBox="0 0 620 440" id="view" aria-label="工序示意与配对纹样"></svg></div><aside><small id="count"></small><h2 id="title"></h2><p id="desc"></p><div id="controls"></div><p aria-live="polite" id="status"></p></aside></div><p class="footer">体验中九格换版、手杆增力与手轮吊架为设计改编。浸染与氧化采用跳时演示，真实色深和所需时间须用布样验证。 <a href="https://cnzx.cncn.gov.cn/art/2023/7/25/art_1302240_58827700.html">苍南夹缬工艺记录</a></p></div></main>
<script>
const $=id=>document.getElementById(id),V=$('view'),names=['对版','压紧','入缸','提板','揭布'],motifs=['花','菱','叶'];let step=0,pattern=[0,1,2,1,0,1,2,1,0],prediction='',press=0,locked=false,depth=0,turn=0,peel=0,drag=null;
const P=(x,y,z)=>[100+x+.43*y,348+.18*x-.32*y-z],poly=(pts,fill)=>'<polygon points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="'+fill+'" stroke="#50635c" stroke-width="1.1"/>',line=(a,b,color='#4a6460',w=4)=>'<path d="M'+a+' L'+b+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round"/>',txt=(x,y,s)=>'<text x="'+x+'" y="'+y+'">'+s+'</text>';
function box(x,y,z,w,d,h,p){let a=(i,j,k)=>P(x+i*w,y+j*d,z+k*h);return poly([a(1,0,0),a(1,1,0),a(1,1,1),a(1,0,1)],p[1])+poly([a(0,0,0),a(1,0,0),a(1,0,1),a(0,0,1)],p[0])+poly([a(0,0,1),a(1,0,1),a(1,1,1),a(0,1,1)],p[2])}
const iron=['#537571','#3e5b59','#91a59a'],wood=['#be966b','#94744f','#dfbd91'],cloth=['#ede3c8','#b5bba7','#fff6da'];
function tiles(x,y,size,blue,mirror=false){let s='';pattern.forEach((_,i)=>{let row=Math.floor(i/3),col=i%3,v=pattern[row*3+(mirror?2-col:col)],cx=x+(col+.5)*size,cy=y+(row+.5)*size,r=size*.33,d='';for(let j=0;j<=72;j++){let t=2*Math.PI*j/72,rad=v===0?r*(.73+.26*Math.cos(6*t)):v===1?r/(Math.abs(Math.cos(t))+Math.abs(Math.sin(t))):r,xx=rad*Math.cos(t)*(v===2?.53:1),yy=rad*Math.sin(t)+(v===2?xx*.55:0);d+=(j?'L':'M')+(cx+xx)+' '+(cy+yy)}s+='<rect x="'+(cx-size/2)+'" y="'+(cy-size/2)+'" width="'+size+'" height="'+size+'" fill="'+(blue?'#234e6d':'#bd9264')+'" stroke="'+(blue?'#234e6d':'#95734f')+'"/><path d="'+d+'Z" fill="'+(blue?'#f4ecd5':'#ebcc9d')+'"/>'});return s}
function draw(){document.getElementById('machine').contentWindow?.refreshMachine?.();let s=txt(20,28,step===0?'配对花版 · 两个内侧面朝向观众':step===4?'开版台 · 木版与染样对照':'工序示意 · 下部湿区'),z=135-depth*110;
if(step===0){s+=tiles(80,100,58,false)+tiles(365,100,58,false,true)+txt(118,310,'前版内侧')+txt(405,310,'后版内侧')+txt(125,360,'两块花版相向闭合，对应位置左右镜像。')}
else if(step===4){s+=tiles(54,115,58,false)+txt(78,326,'选定花版')+tiles(332,115,58,true);let w=174*(1-peel);if(w>0)s+='<rect x="'+(506-w)+'" y="115" width="'+w+'" height="174" fill="#ba9269" stroke="#876b50"/>'+line([506-w,115],[506-w,289],'#e0bf95',6);s+=txt(351,326,'同一纹样布样')+txt(100,370,'在布样上向右拖动，逐格查看染后的留白。')}
else {s+=box(-32,-22,-9,354,154,8,iron)+box(-10,102,0,13,13,302,iron)+box(279,102,0,13,13,302,iron)+box(-10,101,289,302,14,14,iron)+box(4,18,0,220,96,7,iron)+box(4,106,6,220,7,95,iron);
let sep=step===1?32*(1-press):0,cy=70;s+=line(P(120,106,291),P(120,cy,z+93),'#465a57',3)+box(51,cy,z+82,140,9,9,iron)+box(56,cy+sep,z,131,7,83,wood)+box(60,cy-3,z,122,2,80,cloth)+box(56,cy-11-sep,z,131,7,83,wood);
if(locked)s+=box(52,cy-13,z+72,12,26,6,iron)+box(178,cy-13,z+72,12,26,6,iron);
s+=poly([P(11,25,89),P(216,25,89),P(216,105,89),P(11,105,89)],'rgba(49,102,124,.74)')+box(4,18,6,220,7,95,iron);
let pivot=P(10,32,160),a=-1.3+(press)*1.1,gr=[pivot[0]+60*Math.cos(a),pivot[1]+60*Math.sin(a)];s+=line(pivot,gr,'#a36543',10)+line(gr,[gr[0]-13,gr[1]],'#364f50',9);
let h=[472,166];s+='<circle cx="472" cy="166" r="50" fill="none" stroke="#826449" stroke-width="7"/>';for(let j=0;j<6;j++){let a=turn+j*Math.PI/3;s+=line(h,[472+47*Math.cos(a),166+47*Math.sin(a)],'#9b805d',4)}s+=txt(427,245,'手轮与卷筒')+txt(80,400,'底部染盒与承液盘');}
V.innerHTML=s}
function ui(){$('headType').disabled=$('inputType').disabled=step!==0;let c=$('controls');c.replaceChildren();$('count').textContent='工序 '+(step+1)+' / 5';$('title').textContent=['摸版对纹','驱动合版','摇轮入缸','摇轮提板','解锁揭布'][step];$('rail').innerHTML=names.map((s,i)=>i===step?'<b>'+s+'</b>':s).join('　›　');$('desc').textContent=['选择中央格的纹样，再预测染液沿凹槽进入后，哪一处会留白。','拖动夹紧输入，观察上方总装的输入轴、双曲柄和滑座。到位后锁住夹框，再单独退开压靴。','夹框已经锁紧。沿手轮顺时针拖动，或用按钮逐段降框。','本段跳过实际浸染等待。反向摇轮，把同一副版提回缸口滴液、氧化。','夹框已回到支座，压头接管夹力后解锁。拖动揭布进度，对照中央格与自己的预测。'][step];
function btn(t,f,on=true){let b=document.createElement('button');b.textContent=t;b.disabled=!on;b.onclick=f;c.append(b);return b}
function slider(label,val,f){let l=document.createElement('label');l.textContent=label;let r=document.createElement('input');r.type='range';r.min=0;r.max=100;r.value=Math.round(val*100);r.oninput=()=>{f(+r.value/100);draw();status();let b=c.querySelector('.primary');if(b&&step===1)b.disabled=press<1};l.append(r);c.append(l)}
if(step===0){motifs.forEach((v,i)=>btn((pattern[4]===i?'✓ ':'')+v,()=>{pattern[4]=i;ui()}));c.append(document.createElement('br'));['凸纹处','凹槽处'].forEach(v=>btn((prediction===v?'✓ ':'')+'预测：'+v,()=>{prediction=v;ui()}));btn('对齐两版，放入白布',()=>next(),!!prediction).className='primary'}
if(step===1){slider('夹紧输入行程',press,v=>press=v);btn('扣紧随框锁扣',()=>{locked=true;next()},press===1).className='primary'}
if(step===2&&press>0){btn('退开两侧压靴',()=>{press=0;ui()}).className='primary';$('desc').textContent='夹框已经锁紧。夹紧机构反向回程，让出竖直吊运通道。'}
else if(step===3&&handoff){$('desc').textContent='花版已在缸口上方完成示意氧化。先让压靴接管夹力，再开扣、回程揭布。';btn(press===0?'压靴接回夹框':'开扣、退压、揭布',()=>{if(press===0)press=1;else{locked=false;press=0;step=4}ui()}).className='primary'}
else if(step===2||step===3){btn(step===2?'顺摇四分之一圈':'反摇四分之一圈',()=>wheel(step===2?Math.PI/2:-Math.PI/2));btn(step===2?'完成示意浸染':'完成示意氧化，回座开版',()=>next(),step===2?depth>=.999:depth<=.001).className='primary'}
if(step===4){slider('揭布进度',peel,v=>peel=v);btn('重新选版',()=>{step=0;press=depth=turn=peel=0;locked=false;prediction='';handoff=false;ui()})}draw();status()}
function status(){$('status').textContent=step===0?'中央格：'+motifs[pattern[4]]:step===1?'合版行程 '+Math.round(press*100)+'%':step===2||step===3?'浸入行程 '+Math.round(depth*100)+'%':peel<1?'已揭开 '+Math.round(peel*100)+'%':'你预测「'+prediction+'」，揭布可见：凸纹压住布面处留白，沟槽进液处染蓝。'}
function next(){if(step===3){handoff=true;ui();return}step++;ui()}
function wheel(da){if(press>0||handoff)return;if(step!==2&&step!==3)return;let val=Math.max(0,Math.min(1,depth+da/(2*Math.PI)));turn+=(val-depth)*2*Math.PI;depth=val;draw();status();$('controls').querySelector('.primary').disabled=step===2?depth<.999:depth>.001}
function point(e){let p=V.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(V.getScreenCTM().inverse())}
V.onpointerdown=e=>{let p=point(e);if((step===2||step===3)&&Math.hypot(p.x-472,p.y-166)<75)drag=Math.atan2(p.y-166,p.x-472);else if(step===4&&p.x>300)drag='cloth';else return;V.setPointerCapture(e.pointerId)};
V.onpointermove=e=>{if(drag===null)return;let p=point(e);if(drag==='cloth'){peel=Math.max(0,Math.min(1,(p.x-332)/174));$('controls').querySelector('input').value=peel*100;draw();status();return}let a=Math.atan2(p.y-166,p.x-472),d=Math.atan2(Math.sin(a-drag),Math.cos(a-drag));drag=a;wheel(d)};V.onpointerup=V.onpointercancel=()=>drag=null;
let handoff=false;window.machineState=()=>({press,latched:locked,depth,dyed:step>=3,ext:+$('extType').value,pattern});
const models=["\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>立式悬臂对夹 · 3D 机构台\u003c/title>\n\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f2f2e9;color:#223d40;font:15px/1.6 \"Microsoft YaHei\",sans-serif}main{max-width:1350px;margin:auto;padding:20px 3.5vw}header{border-bottom:1px solid #acbab1;display:flex;justify-content:space-between;font-size:13px;padding-bottom:10px}h1,h2{font-family:SimSun,serif}h1{font-size:clamp(32px,4vw,54px);margin:14px 0 0}p{margin:5px 0 15px}.work{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(250px,1fr);background:#fbfaf3;border:1px solid #abbab2}.model{position:relative;min-width:0;background:radial-gradient(ellipse,#f5f5e9,#d8e4db)}canvas{width:100%;height:clamp(380px,64vh,720px);display:block;touch-action:none;cursor:grab}.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#425b58;pointer-events:none;background:#edf1e6dc;padding:2px 6px}aside{padding:18px;border-left:1px solid #bac5bb}h2{margin:4px 0 8px;font-size:23px}button,select{font:inherit;color:inherit;border:1px solid #97aaa1;background:#fafaf1;padding:5px 9px;border-radius:3px;cursor:pointer}button:disabled{opacity:.45}.bar{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.main{background:#245b68;color:white}input[type=range],select{width:100%}input{accent-color:#226476}output{font-weight:bold}small{color:#526763}.read{border-top:1px solid #c1cbc0;padding-top:8px;margin-top:12px}details{margin:14px 0;padding:12px;background:#e8ebe0}summary{cursor:pointer;font-weight:bold}@media(max-width:760px){.work{grid-template-columns:1fr}aside{border:0}canvas{height:420px}}main{padding:0}.work{display:block}.work aside,main>p,details,main>.bar{display:none}canvas{height:420px}\u003c/style>\n\u003cmain>\u003cp>\u003cb>踏板 → 长拉杆 → 横轴摇臂 → 对称连杆 → 悬臂滑座\u003c/b>\u003c/p>\u003cdiv class=\"work\">\u003cdiv class=\"model\">\u003ccanvas id=\"cv\" aria-label=\"可旋转的三维夹紧机构\">\u003c/canvas>\u003cspan class=\"hint\">拖动旋转 · 滚轮或按钮缩放 · 可在右侧选件定位\u003c/span>\u003c/div>\u003caside>\u003ch2>踏板联动\u003c/h2>\u003clabel>\u003cinput id=\"power\" type=\"checkbox\" checked> 高亮踏板与输入拉杆\u003c/label>\u003clabel for=\"travel\">脚踏联动行程　\u003coutput id=\"pct\">\u003c/output>\u003c/label>\u003cinput id=\"travel\" type=\"range\" min=\"0\" max=\"100\" value=\"0\">\u003cdiv class=\"bar\">\u003cbutton id=\"run\" class=\"main\">踩下踏板\u003c/button>\u003c/div>\u003cdiv id=\"status\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"read\">\u003cstrong>观察方向\u003c/strong>\u003cdiv class=\"bar\">\u003cbutton data-v=\"iso\">轴测\u003c/button>\u003cbutton data-v=\"side\">传动侧视\u003c/button>\u003cbutton data-v=\"top\">受力俯视\u003c/button>\u003cbutton id=\"plus\" aria-label=\"放大\">＋\u003c/button>\u003cbutton id=\"minus\" aria-label=\"缩小\">－\u003c/button>\u003c/div>\u003clabel>\u003cinput type=\"checkbox\" id=\"cut\"> 剖视：隐藏一侧夹板\u003c/label>\u003c/div>\u003cdiv class=\"read\">\u003clabel for=\"part\">高亮零部件\u003c/label>\u003cselect id=\"part\">\u003c/select>\u003cp id=\"info\">\u003c/p>\u003c/div>\u003csmall id=\"measure\">\u003c/small>\u003c/aside>\u003c/div>\u003cdetails open>\u003csummary>装配接口与校核\u003c/summary>\u003cp>主轴两端用轴承座支承，外侧输入摇臂与内侧对称摇臂固连。重点看长悬臂对版面上下缘压力的影响。\u003c/p>\u003cp>踏板支点装在固定双耳座；拉杆按中心距装配，销端轴向限位。运动模型采用刚性杆；回位弹簧、机械止挡、护罩和承载锁止需另行设计。松脚保压需独立锁止并验证。\u003c/p>\u003c/details>\u003c/main>\n\u003cscript>const mode=0;const $=x=>document.getElementById(x),canvas=$('cv'),g=canvas.getContext('2d'),parts=['机架','导杆与销轴','对称滑座','摇臂与连杆','夹板支撑','夹板背板'],notes=parts;\nparts.forEach((t,i)=>$('part').add(new Option(t,i)));\nlet u=0,locked=false,anim=0,yaw=.67,pitch=.32,zoom=1,faces=[],labels=[],sel=0,W,H,scale;\nconst V=(a,b)=>a.map((x,i)=>x-b[i]),add=(a,b)=>a.map((x,i)=>x+b[i]),mul=(a,s)=>a.map(x=>x*s),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>mul(a,1/Math.hypot(...a));\nfunction proj([x,y,z]){x-=12;z-=12;const d=x*Math.sin( m=requestAnimationFrame(tick)}anim=requestAnimationFrame(tick)};\ndocument.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{[yaw,pitch]={iso:[.67,.32],side:[0,.02],top:[0,1.55]}[b.dataset.v];draw()});$('cut').onchange=draw;\nfunction zoomBy(k){zoom=Math.min(2.4,Math.max(.55,zoom*k));draw()}$('plus').onclick=()=>zoomBy(1.15);$('minus').onclick=()=>zoomBy(1/1.15);canvas.onwheel=e=>{e.preventDefault();zoomBy(Math.exp(-e.deltaY*.001))};let drag=null;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY]};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch=Math.min(1.56,Math.max(-.55,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;$('power').onchange=draw;window.refreshMachine=draw;window.addEventListener('resize',draw);draw();\n\u003c/script>\u003c/html>\r\n","\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>卧式滑台对夹 · 3D 机构台\u003c/title>\n\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f2f2e9;color:#223d40;font:15px/1.6 \"Microsoft YaHei\",sans-serif}main{max-width:1350px;margin:auto;padding:20px 3.5vw}header{border-bottom:1px solid #acbab1;display:flex;justify-content:space-between;font-size:13px;padding-bottom:10px}h1,h2{font-family:SimSun,serif}h1{font-size:clamp(32px,4vw,54px);margin:14px 0 0}p{margin:5px 0 15px}.work{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(250px,1fr);background:#fbfaf3;border:1px solid #abbab2}.model{position:relative;min-width:0;background:radial-gradient(ellipse,#f5f5e9,#d8e4db)}canvas{width:100%;height:clamp(380px,64vh,720px);display:block;touch-action:none;cursor:grab}.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#425b58;pointer-events:none;background:#edf1e6dc;padding:2px 6px}aside{padding:18px;border-left:1px solid #bac5bb}h2{margin:4px 0 8px c/p>\u003c/div>\u003csmall id=\"measure\">\u003c/small>\u003c/aside>\u003c/div>\u003cdetails open>\u003csummary>装配接口与校核\u003c/summary>\u003cp>卧式摇臂绕竖轴转动，踏板绕横轴转动。偏置球头拉杆跨接这两个平面，两个球铰适应摆角；实际应按全行程选球头容许偏转角。\u003c/p>\u003cp>踏板支点装在固定双耳座；拉杆按中心距装配，销端轴向限位。运动模型采用刚性杆；回位弹簧、机械止挡、护罩和承载锁止需另行设计。松脚保压需独立锁止并验证。\u003c/p>\u003c/details>\u003c/main>\n\u003cscript>const mode=1;const $=x=>document.getElementById(x),canvas=$('cv'),g=canvas.getContext('2d'),parts=['机架','导杆与销轴','对称滑座','摇臂与连杆','夹板支撑','夹板背板'],notes=parts;\nparts.forEach((t,i)=>$('part').add(new Option(t,i)));\nlet u=0,locked=false,anim=0,yaw=.67,pitch=.32,zoom=1,faces=[],labels=[],sel=0,W,H,scale;\nconst V=(a,b)=>a.map((x,i)=>x-b[i]),add=(a,b)=>a.map((x,i)=>x+b[i]),mul=(a,s)=>a.map(x=>x*s),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>mul(a,1/Math.hypot(...a));\nfunction proj([x,y,z]){x-=12;z-=12;const d=x*Math.sin(yaw)-y*Math.cos(yaw);return [W*.5+scale*(x*Math.cos(yaw)+y*Math.sin(yaw)),H*.5+scale*(d*Math.sin(pitch)-z*Math.cos(pitch)),d*Math.cos(pitch)+z*Math.sin(pitch)]}\nfunction face(p,col,id,shade){let q=p.map(proj);faces.push({q,depth:q.reduce((s,v)=>s+v[2],0)/q.length,col:sel&&id===sel?'#e68b43':col,shade})}\nfunction box(x,y,z,w,d,h,color,id){let p=Array.from({length:8},(_,i)=>[x+(i&1?w:0),y+(i&2?d:0),z+(i&4?h:0)]);[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]].forEach((f,i)=>face(f.map(k=>p[k]),color,id,[.22,0,.1,.15,.22,.08][i]))}\nfunction rod(a,b,r,col,id,n=8){let v=unit(V(b,a)),e=unit(cross(v,Math.abs(v[2])>.9?[0,1,0]:[0,0,1])),f=cross(v,e),ring=(o)=>Array.from({length:n},(_,i)=>add(o,add(mul(e,r*Math.cos(i*2*Math.PI/n)),mul(f,r*Math.sin(i*2*Math.PI/n))))),p=ring(a),q=ring(b);for(let i=0;i\u003cn;i++){let j=(i+1)%n;face([p[i],p[j],q[j],q[i]],col,id,.09+.09*Math.cos(i*2*Math.PI/n))}face(p,col,id,.09);face(q,col,id,.04)}\nconst metal='#72918c',orange='#b77447',wood='#d3ac79',steel='#b3bcb1',dark='#426163';\nfunction draw(){const st=parent.machineState();u=st.press;W=ca cale=1\">\u003ctitle>脚踏短臂夹染台 · 3D 机构台\u003c/title>\n\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f2f2e9;color:#223d40;font:15px/1.6 \"Microsoft YaHei\",sans-serif}main{max-width:1350px;margin:auto;padding:20px 3.5vw}header{border-bottom:1px solid #acbab1;display:flex;justify-content:space-between;font-size:13px;padding-bottom:10px}h1,h2{font-family:SimSun,serif}h1{font-size:clamp(32px,4vw,54px);margin:14px 0 0}p{margin:5px 0 15px}.work{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(250px,1fr);background:#fbfaf3;border:1px solid #abbab2}.model{position:relative;min-width:0;background:radial-gradient(ellipse,#f5f5e9,#d8e4db)}canvas{width:100%;height:clamp(380px,64vh,720px);display:block;touch-action:none;cursor:grab}.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#425b58;pointer-events:none;background:#edf1e6dc;padding:2px 6px}aside{padding:18px;border-left:1px solid #bac5bb}h2{margin:4px 0 8px;font-size:23px}button,select{font:inherit;color:inherit;border:1px solid #97aaa1;background:#fafaf1;padding:5px 9px;border-radius:3px;cursor:pointer}button:disabled{opacity:.45}.bar{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.main{background:#245b68;color:white}input[type=range],select{width:100%}input{accent-color:#226476}output{font-weight:bold}small{color:#526763}.read{border-top:1px solid #c1cbc0;padding-top:8px;margin-top:12px}details{margin:14px 0;padding:12px;background:#e8ebe0}summary{cursor:pointer;font-weight:bold}@media(max-width:760px){.work{grid-template-columns:1fr}aside{border:0}canvas{height:420px}}main{padding:0}.work{display:block}.work aside,main>p,details,main>.bar{display:none}canvas{height:420px}\u003c/style>\n\u003cmain>\u003cp>\u003cb>踏板 → 长拉杆 → 输入横轴 → 顶部摇臂 → 短臂花版\u003c/b>\u003c/p>\u003cdiv class=\"work\">\u003cdiv class=\"model\">\u003ccanvas id=\"cv\" aria-label=\"可旋转的三维夹紧机构\">\u003c/canvas>\u003cspan class=\"hint\">拖动旋转 · 滚轮或按钮缩放 · 可在右侧选件定位\u003c/span>\u003c/div>\u003caside>\u003ch2>踏板联动\u003c/h2>\u0 \u003c/html>\r\n","\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>齿轮联动双滑座 · 3D 机构台\u003c/title>\n\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f2f2e9;color:#223d40;font:15px/1.6 \"Microsoft YaHei\",sans-serif}main{max-width:1350px;margin:auto;padding:20px 3.5vw}header{border-bottom:1px solid #acbab1;display:flex;justify-content:space-between;font-size:13px;padding-bottom:10px}h1,h2{font-family:SimSun,serif}h1{font-size:clamp(32px,4vw,54px);margin:14px 0 0}p{margin:5px 0 15px}.work{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(250px,1fr);background:#fbfaf3;border:1px solid #abbab2}.model{position:relative;min-width:0;background:radial-gradient(ellipse,#f5f5e9,#d8e4db)}canvas{width:100%;height:clamp(380px,64vh,720px);display:block;touch-action:none;cursor:grab}.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#425b58;pointer-events:none;background:#edf1e6dc;padding:2px 6px}aside{padding:18px;border-left:1px solid #bac5bb}h2{margin:4px 0 8px;font-size:23px}button,select{font:inherit;color:inherit;border:1px solid #97aaa1;background:#fafaf1;padding:5px 9px;border-radius:3px;cursor:pointer}button:disabled{opacity:.45}.bar{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.main{background:#245b68;color:white}input[type=range],select{width:100%}input{accent-color:#226476}output{font-weight:bold}small{color:#526763}.read{border-top:1px solid #c1cbc0;padding-top:8px;margin-top:12px}details{margin:14px 0;padding:12px;background:#e8ebe0}summary{cursor:pointer;font-weight:bold}@media(max-width:760px){.work{grid-template-columns:1fr}aside{border:0}canvas{height:420px}}main{padding:0}.work{display:block}.work aside,main>p,details,main>.bar{display:none}canvas{height:420px}\u003c/style>\n\u003cmain>\u003cp>\u003cb>踏板 → 拉杆 → 主动齿轮轴 → 反向齿轮副 → 双曲柄 → 滑座\u003c/b>\u003c/p>\u003cdiv class=\"work\">\u003cdiv class=\"model\">\u003cca );\nfunction proj([x,y,z]){x-=12;z-=12;const d=x*Math.sin(yaw)-y*Math.cos(yaw);return [W*.5+scale*(x*Math.cos(yaw)+y*Math.sin(yaw)),H*.5+scale*(d*Math.sin(pitch)-z*Math.cos(pitch)),d*Math.cos(pitch)+z*Math.sin(pitch)]}\nfunction face(p,col,id,shade){let q=p.map(proj);faces.push({q,depth:q.reduce((s,v)=>s+v[2],0)/q.length,col:sel&&id===sel?'#e68b43':col,shade})}\nfunction box(x,y,z,w,d,h,color,id){let p=Array.from({length:8},(_,i)=>[x+(i&1?w:0),y+(i&2?d:0),z+(i&4?h:0)]);[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]].forEach((f,i)=>face(f.map(k=>p[k]),color,id,[.22,0,.1,.15,.22,.08][i]))}\nfunction rod(a,b,r,col,id,n=8){let v=unit(V(b,a)),e=unit(cross(v,Math.abs(v[2])>.9?[0,1,0]:[0,0,1])),f=cross(v,e),ring=(o)=>Array.from({length:n},(_,i)=>add(o,add(mul(e,r*Math.cos(i*2*Math.PI/n)),mul(f,r*Math.sin(i*2*Math.PI/n))))),p=ring(a),q=ring(b);for(let i=0;i\u003cn;i++){let j=(i+1)%n;face([p[i],p[j],q[j],q[i]],col,id,.09+.09*Math.cos(i*2*Math.PI/n))}face(p,col,id,.09);face(q,col,id,.04)}\nconst metal='#72918c',orange='#b77447',wood='#d3ac79',steel='#b3bcb1',dark='#426163';\nfunction draw(){const st=parent.machineState();u=st.press;W=canvas.clientWidth;H=canvas.clientHeight;const dpi=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(W*dpi)||canvas.height!==Math.round(H*dpi)){canvas.width=Math.round(W*dpi);canvas.height=Math.round(H*dpi)}g.setTransform(dpi,0,0,dpi,0,0);g.clearRect(0,0,W,H);scale=Math.min(W/378,H/290)*zoom;faces=[];labels=[];\n\n\nconst rad=Math.PI/180, cut=$('cut').checked, c=['','#5a726d','#bd854d','#6486a1','#ad6452','#bc9165','#71948a'];\nconst b=(x,y,z,w,d,h,id)=>box(x,y,z,w,d,h,c[id],id),r=(a,b,w,id)=>rod(a,b,w,c[id],id,10);\nfunction pin(x,y,z){r([x,y-4,z],[x,y+4,z],2.7,2)}\nfunction jaw(sign,x,z){if(cut&&sign===1)return;b(sign>0?x:-x-5,-22,z,5,44,40,5);for(let y of [-17,14])b(sign>0?x+5:-x-8,y,z+2,3,3,36,4)}\nlet gap,readout;\n\nconst t=(36+80*u)*rad,R=18,L=39,dist=a=>20+R*Math.cos(a)+Math.sqrt(L*L-(R*Math.sin(a))**2),sx=dist(t);gap=1+sx-dist(116*rad);\nfor(let sign of [-1,1]){\nlet x=sign*20,ang=sign===1?t:Math.PI-t;\nb(x-6,9,20,12,13,33,1);r([x,-12,40],[x,23,40],3.5,2);\nr([x,-6,40],[x,0,40],18.7,3,20);\nfor(let j=0;j\u003c20;j++){let a=ang+j*Math.PI/10+(sign\u003c0?Math.PI/20:0);\nlet groove=(A,rr,Y)=>[x+rr*Math.cos(A),Y,40+rr*Math.sin(A)];\nlet ring=[[-.108,18.4],[-.053,21.5],[.053,21.5],[.108,18.4]];\nfor(let k=0;k\u003c4;k++){let [a1,r1]=ring[k],[a2,r2]=ring[(k+1)%4];face([groove(a+a1,r1,-6),groove(a+a2,r2,-6),groove(a+a2,r2,0),groove(a+a1,r1,0)],c[3],3,.1)}face(ring.map(([v,rr])=>groove(a+v,rr,-6)),c[3],3,.02)}\nlet q=[x+R*Math.cos(ang),-10,40+R*Math.sin(ang)],S=[sign*sx,-10,40];r([x,-10,40],q,3.6,2);r(q,S,2.8,4);pin(...q);pin(...S);\nb(sign*sx-5,-13,11,10,12,33,4);r([sign*sx,-5,13],[sign*(gap+11),-5,-19],4,4);jaw(sign,gap+5,-44)}\nfor(let z of [12,26])r([-76,-4,z],[76,-4,z],2,1);\nb(-77,16,5,154,7,15,1);for(let x of [-76,73])b(x,-5,8,4,25,23,1);\nreadout='输入轮摆角 '+(80*u).toFixed(0)+'° · 输出轮反向等角度摆动';\nconst hi=$('power').checked,pc=hi?'#c35431':'#9c8369',sc=hi?'#d18a35':'#8b998e',radP=Math.PI/180;\nfunction rr(p,q,r,c){rod(p,q,r,c,20,9)}\nfunction ball(p){rr([p[0],p[1]-3,p[2]],[p[0],p[1]+3,p[2]],4.1,sc)}\nlet P,Q,T,angP;\nconst shaftX=20,shaftZ=40,phi=(36+80*u)*radP;\nP=[shaftX-43,-38,-42];let O=[shaftX,-38,shaftZ],v=[16*Math.cos(phi+1.35),0,16*Math.sin(phi+1.35)];\nQ=add(P,v);T=add(O,v);rr(O,T,3.5,pc);rr(O,[shaftX,4,shaftZ],3.5,'#74837b');angP=phi+1.85;\nconst datum=-44,kind=1,highAxis=[P[0],-56,P[2]+(kind?72:0)];\nrr(P,Q,3.4,pc);rr(Q,T,2.6,sc);ball(Q);ball(T);\nfor(let yy of [-50,-33])box(P[0]-5,yy,-77,10,3,highAxis[2]+83,'#59756b',0);\nrr([P[0],-57,P[2]],[P[0],-30,P[2]],3.4,'#607974',8);\nif(kind===0){let toe=add(P,[46*Math.cos(angP),0,46*Math.sin(angP)]);for(let yy of [-53,-39])rr([P[0],yy,P[2]],[toe[0],yy,toe[2]],3.8,pc);box(toe[0]-8,-59,toe[2]-2,16,26,4,pc,8)}\nelse{rr(highAxis,[P[0],-31,highAxis[2]],3.4,'#607974',8);let v=[16*Math.cos(angP+.8),0,16*Math.sin(angP+.8)],up=[P[0],-52,highAxis[2]],low=[P[0],-52,P[2]];\nrr(up,add(up,v),3,pc);rr(low,add(low,v),3,pc);rr(add(up,v),add(low,v),2.6,sc);let at=(a,r)=>add(highAxis,[r*Math.cos(a),0,r*Math.sin(a)]);\nif(kind===1){for(let j=0;j\u003c32;j++){let a=angP+j*Math.PI/16;rr(at(a,28),at(a+Math.PI/16,28),2,pc);if(j%8===0)rr(highAxis,at(a,28),2,pc)}}else rr(highAxis,at(angP,58),3.5,pc);let hand=at(angP,kind===1?28:58);rr(hand,add(hand,[0,-12,0]),3.4,sc)}\nconst zDeck=datum-st.depth*22*Math.PI,openX=0;\nfunction plate(x,y,z,w,d,h,color){box(x,y,z,w,d,h,color,30)}\nfunction link(a,b,r,color){rod(a,b,r,color,30,10)}\nconst frame='#4e716b',woodFace='#cea578',shaftSteel='#afb9ad',latch='#c2914e';\nfor(const side of [-1,1]){\n let outer=side*(1+openX);\n plate(side>0?outer:outer-5,-23,zDeck,5,46,40,woodFace);\n for(let j=0;j\u003c9;j++){let row=Math.floor(j/3),col=j%3,yy=-19+col*13,zz=zDeck+4+row*11;\n plate(side>0?outer-.6:outer,yy,zz,.6,12,10,'#b78959');let xx=side>0?outer-.7:outer+.7,shape=st.pattern[j],pts=[];for(let k=0;k\u003c36;k++){let a=2*Math.PI*k/36,rr=shape===0?3.7*(.73+.26*Math.cos(6*a)):shape===1?3.7/(Math.abs(Math.cos(a))+Math.abs(Math.sin(a))):3.7;pts.push([xx,yy+6+(shape===2?.55:1)*rr*Math.cos(a),zz+5+rr*Math.sin(a)])}face(pts,'#efcfa1',30,0)}\n}\nplate(-.4,-20,zDeck+1,.8,40,38,st.dyed?'#335c79':'#f0e7ce');\nfor(let y of [-27,26]){\n plate(-7,y,zDeck+39,14,3,4,shaftSteel);\n if(st.latched)plate(-6,y,zDeck+30,12,3,7,latch);\n link([0,y,zDeck+43],[0,y,79],.8,frame);\n link([-11,y-3,79],[-11,y+3,79],11,latch);\n}\nlink([-11,-37,79],[-11,59,79],2.8,shaftSteel);\nfor(let y of [-34,34]){plate(-20,y,70,18,5,16,frame);plate(-52,y,70,40,5,7,frame);plate(-56,y,-126,6,5,208,frame)}\nfor(let j=0;j\u003c32;j++){let a=2*Math.PI*(j/32+st.depth),b=a+Math.PI/16,wp=t=>[-11+22*Math.cos(t),58,79+22*Math.sin(t)];link(wp(a),wp(b),1.9,frame);if(j%8===0)link([-11,58,79],wp(a),1.4,latch);if(j===0)link(wp(a),add(wp(a),[0,8,0]),2.8,latch)}\nplate(-63,-40,datum-85,126,82,3,frame);plate(-29,-33,datum-77,58,66,3,'#5 to-from)*k*k*(3-2*k);draw();if(k\u003c1)anim=requestAnimationFrame(tick)}anim=requestAnimationFrame(tick)};\ndocument.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{[yaw,pitch]={iso:[.67,.32],side:[0,.02],top:[0,1.55]}[b.dataset.v];draw()});$('cut').onchange=draw;\nfunction zoomBy(k){zoom=Math.min(2.4,Math.max(.55,zoom*k));draw()}$('plus').onclick=()=>zoomBy(1.15);$('minus').onclick=()=>zoomBy(1/1.15);canvas.onwheel=e=>{e.preventDefault();zoomBy(Math.exp(-e.deltaY*.001))};let drag=null;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY]};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch=Math.min(1.56,Math.max(-.55,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;$('power').onchange=draw;window.refreshMachine=draw;window.addEventListener('resize',draw);draw();\n\u003c/script>\u003c/html>\r\n","\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>齿轮联动双滑座 · 3D 机构台\u003c/title>\n\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f2f2e9;color:#223d40;font:15px/1.6 \"Microsoft YaHei\",sans-serif}main{max-width:1350px;margin:auto;padding:20px 3.5vw}header{border-bottom:1px solid #acbab1;display:flex;justify-content:space-between;font-size:13px;padding-bottom:10px}h1,h2{font-family:SimSun,serif}h1{font-size:clamp(32px,4vw,54px);margin:14px 0 0}p{margin:5px 0 15px}.work{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(250px,1fr);background:#fbfaf3;border:1px solid #abbab2}.model{position:relative;min-width:0;background:radial-gradient(ellipse,#f5f5e9,#d8e4db)}canvas{width:100%;height:clamp(380px,64vh,720px);display:block;touch-action:none;cursor:grab}.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#425b58;pointer-events:none;background:#edf1e6dc;padding:2px 6px}aside{padding:18px;border-left:1px solid #bac5bb}h2{margin:4px 0 8px;font-size:23px}button,select{font:inherit;color:inherit;border:1px solid #97aaa1;background:#fafaf1;padding:5px 9px;border-radius:3px;cursor:pointer}button:disabled{opacity:.45}.bar{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.main{background:#245b68;color:white}input[type=range],select{width:100%}input{accent-color:#226476}output{font-weight:bold}small{color:#526763}.read{border-top:1px solid #c1cbc0;padding-top:8px;margin-top:12px}details{margin:14px 0;padding:12px;background:#e8ebe0}summary{cursor:pointer;font-weight:bold}@media(max-width:760px){.work{grid-template-columns:1fr}aside{border:0}canvas{height:420px}}main{padding:0}.work{display:block}.work aside,main>p,details,main>.bar{display:none}canvas{height:420px}\u003c/style>\n\u003cmain>\u003cp>\u003cb>踏板 → 拉杆 → 主动齿轮轴 → 反向齿轮副 → 双曲柄 → 滑座\u003c/b>\u003c/p>\u003cdiv class=\"work\">\u003cdiv class=\"model\">\u003ccanvas id=\"cv\" aria-label=\"可旋转的三维夹紧机构\">\u003c/canvas>\u003cspan class=\"hint\">拖动旋转 · 滚轮或按钮缩放 · 可在右侧选件定位\u003c/span>\u003c/div>\u003caside>\u003ch2>踏板联动\u003c/h2>\u003clabel>\u003cinput id=\"power\" type=\"checkbox\" checked> 高亮踏板与输入拉杆\u003c/label>\u003clabel for=\"travel\">脚踏联动行程　\u003coutput id=\"pct\">\u003c/output>\u003c/label>\u003cinput id=\"travel\" type=\"range\" min=\"0\" max=\"100\" value=\"0\">\u003cdiv class=\"bar\">\u003cbutton id=\"run\" class=\"main\">踩下踏板\u003c/button>\u003c/div>\u003cdiv id=\"status\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"read\">\u003cstrong>观察方向\u003c/strong>\u003cdiv class=\"bar\">\u003cbutton data-v=\"iso\">轴测\u003c/button>\u003cbutton data-v=\"side\">传动侧视\u003c/button>\u003cbutton data-v=\"top\">受力俯视\u003c/button>\u003cbutton id=\"plus\" aria-label=\"放大\">＋\u003c/button>\u003cbutton id=\"minus\" aria-label=\"缩小\">－\u003c/button>\u003c/div>\u003clabel>\u003cinput type=\"checkbox\" id=\"cut\"> 剖视：隐藏一侧夹板\u003c/label>\u003c/div>\u003cdiv class=\"read\">\u003clabel for=\"part\">高亮零部件\u003c/label>\u003cselect id=\"part\">\u003c/select>\u003cp id=\"info\">\u003c/p>\u003c/div>\u003csmall id=\"measure\">\u003c/small>\u003c/aside>\u003c/div>\u003cdetails open>\u003csummary>装配接口与校核\u003c/summary>\u003cp>脚踏轴经长拉杆推动主动齿轮轴上的输入摇臂。摇臂、主动轮与主动侧曲柄在同轴上固定相位；等齿数从动轮反转，经镜像曲柄推动另一滑座。齿轮承担同步，实际倍率取决于踏臂、曲柄角及连杆。\u003c/p>\u003cp>踏板支点装在固定双耳座；拉杆按中心距装配，销端轴向限位。运动模型采用刚性杆；回位弹簧、机械止挡、护罩和承载锁止需另行设计。松脚保压需独立锁止并验证。\u003c/p>\u003c/details>\u003c/main>\n\u003cscript>const mode=1;const $=x=>document.getElementById(x),canvas=$('cv'),g=canvas.getContext('2d'),parts=['整机','固定支承','输入件','同步传动','连杆与铰点','左右夹板','底部承液盘'],notes=parts;\nparts.forEach((t,i)=>$('part').add(new Option(t,i)));\nlet u=0,locked=false,anim=0,yaw=.67,pitch=.32,zoom=1,faces=[],labels=[],sel=0,W,H,scale;\nconst V=(a,b)=>a.map((x,i)=>x-b[i]),add=(a,b)=>a.map((x,i)=>x+b[i]),mul=(a,s)=>a.map(x=>x*s),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>mul(a,1/Math.hypot(...a));\nfunction proj([x,y,z]){x-=12;z-=12;const d=x*Math.sin(yaw)-y*Math.cos(yaw);return [W*.5+scale*(x*Math.cos(yaw)+y*Math.sin(yaw)),H*.5+scale*(d*Math.sin(pitch)-z*Math.cos(pitch)),d*Math.cos(pitch)+z*Math.sin(pitch)]}\nfunction face(p,col,id,shade){let q=p.map(proj);faces.push({q,depth:q.reduce((s,v)=>s+v[2],0)/q.length,col:sel&&id===sel?'#e68b43':col,shade})}\nfunction box(x,y,z,w,d,h,color,id){let p=Array.from({length:8},(_,i)=>[x+(i&1?w:0),y+(i&2?d:0),z+(i&4?h:0)]);[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]].forEach((f,i)=>face(f.map(k=>p[k]),color,id,[.22,0,.1,.15,.22,.08][i]))}\nfunction rod(a,b,r,col,id,n=8){let v=unit(V(b,a)),e=unit(cross(v,Math.abs(v[2])>.9?[0,1,0]:[0,0,1])),f=cross(v,e),ring=(o)=>Array.from({length:n},(_,i)=>add(o,add(mul(e,r*Math.cos(i*2*Math.PI/n)),mul(f,r*Math.sin(i*2*Math.PI/n))))),p=ring(a),q=ring(b);for(let i=0;i\u003cn;i++){let j=(i+1)%n;face([p[i],p[j],q[j],q[i]],col,id,.09+.09*Math.cos(i*2*Math.PI/n))}face(p,col,id,.09);face(q,col,id,.04)}\nconst metal='#72918c',orange='#b77447',wood='#d3ac79',steel=
